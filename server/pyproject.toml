[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Garneek", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "path>=17.1.1",
    "pillow>=13.0.0",
    "pysqlite3>=0.6.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "toml>=0.10.2",
    "werkzeug>=3.1.9",
]

[project.scripts]
server = "server:main"
test = "test:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
